plugins {
    id 'java'
    id 'org.teavm' version '0.15.0'
}

group = 'todo'
version = '1.0.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

repositories { mavenCentral() }

dependencies {
    implementation teavm.libs.jso
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('test') { useJUnitPlatform() }

teavm {
    all {
        mainClass = 'todo.Main'
        debugInformation = false
    }

    js {
        outputDir = layout.buildDirectory.dir('site')
        relativePathInOutputDir = ''
        targetFileName = 'teavm.js'
    }
}

tasks.register('copyWeb', Copy) {
    from 'web'
    into layout.buildDirectory.dir('site')
}

tasks.named('generateJavaScript') { dependsOn 'copyWeb' }

